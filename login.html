<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 - 无人机科技管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <!-- Logo -->
        <div class="text-center mb-4">
            <i class="bi bi-airplane-engines display-4 text-primary"></i>
            <h3 class="mt-2 fw-bold">后台管理系统</h3>
            <p class="text-muted small">无人机科技 - 内容管理平台</p>
        </div>

        <!-- 消息提示 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- 登录表单 -->
        <form method="POST" action="{{ url_for('admin.login') }}">
            <div class="mb-3">
                <label class="form-label">账号</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" required
                           placeholder="请输入管理员账号" autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" required
                           placeholder="请输入密码" autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-drone w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>登 录
            </button>
        </form>

        <!-- 返回首页 -->
        <div class="text-center mt-4">
            <a href="{{ url_for('front.index') }}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i>返回网站首页
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
